bio: >-
  Hi I am a biotechnologist working at the interface of virology, immunology and
  infectious disease. I am currently a **Research Assistant at the Indian
  Institute of Science (IISc), Bengaluru**, where I am standardizing a protocol
  to rescue Dengue virus from the pFK-DV plasmid.


  Before joining IISc, I spent two years as a **Research Associate at Mynvax**,
  a Bengaluru vaccine start-up, where I worked on preclinical development of
  Influenza and RSV vaccines: propagating and titrating Influenza virus (HAI,
  TCID50), running serological assays (HI, ELISA), immunizing hamsters and mice
  for efficacy studies at IISc's Central Animal Facility, and optimizing
  qPCR/RT-qPCR SOPs for viral titers.


  My earlier research was at CSIR institutes. At **CSIR-IMTech, Chandigarh**, in
  Dr. Pawan Gupta's lab, I studied host nuclear receptors as targets for
  host-directed adjunct therapy against tuberculosis, working in BSL-3 with
  *Mycobacterium tuberculosis* infection models. This work contributed to our
  paper in [Blood Advances
  (2024)](https://doi.org/10.1182/bloodadvances.2023012228) on the nuclear
  receptor Rev-erbα and erythropoietin regulation. At **CSIR-IGIB, New Delhi**,
  I was in charge of the sequencing facility (NovaSeq 6000, MiSeq) for the
  Phenome India gut-microbiome cohort.


  I hold an integrated **M.Tech in Biotechnology** from D.Y. Patil Deemed to be
  University, Navi Mumbai. My thesis, carried out at BRIC-Institute of Life
  Sciences, Bhubaneswar, examined NCoR1-mediated regulation of mitochondrial
  function in macrophages infected with *M. tuberculosis*.


  Outside the lab, I tutor school students in mathematics and science, volunteer
  as a scribe for people with disabilities, and am a regular O-negative blood
  donor (21 donations so far). I speak English, Hindi, Tamil, Kannada and
  Marathi, and I am learning German (A2) and French.
