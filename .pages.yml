media:
  - name: images
    label: Images
    input: assets/img
    output: /assets/img
    extensions: [jpg, jpeg, png, webp]
  - name: pdf
    label: Documents
    input: assets/pdf
    output: /assets/pdf
    extensions: [pdf]

content:
  - name: about
    label: About me (home page text)
    type: file
    path: _data/about.yml
    format: yaml
    fields:
      - name: bio
        label: About me
        type: rich-text
        options:
          format: markdown
          media: false

  - name: news
    label: News (short updates)
    type: collection
    path: _news
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      sort: [date]
      order: desc
      fields: [date]
    fields:
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: layout
        type: string
        hidden: true
        default: post
      - name: inline
        type: boolean
        hidden: true
        default: true
      - name: related_posts
        type: boolean
        hidden: true
        default: false
      - name: body
        label: What happened (one or two sentences)
        type: rich-text
        options:
          format: markdown
          media: false

  - name: projects
    label: Projects
    type: collection
    path: _projects
    filename: "{primary}.md"
    view:
      primary: title
      fields: [importance]
    fields:
      - name: layout
        type: string
        hidden: true
        default: page
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: One-line description
        type: string
      - name: importance
        label: Position on the Projects page (1 shows first)
        type: number
      - name: related_publications
        type: boolean
        hidden: true
        default: true
      - name: body
        label: Details
        type: rich-text
        options:
          format: markdown

  - name: publications
    label: Publications (BibTeX)
    type: file
    path: _bibliography/papers.bib
    format: code

  - name: cv
    label: CV page content
    type: file
    path: _data/cv.yml
    format: code

  - name: socials
    label: Email and social links
    type: file
    path: _data/socials.yml
    format: code
